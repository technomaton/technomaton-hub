name: Sync tm-edpa from upstream release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync (default: latest)"
        required: false
        default: ""
  repository_dispatch:
    types: [edpa-release]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ] && [ -n "${{ github.event.client_payload.tag }}" ]; then
            TAG="${{ github.event.client_payload.tag }}"
          fi
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --repo technomaton/edpa --limit 1 \
              --json tagName --jq '.[0].tagName')
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Syncing tag: $TAG"

      - name: Run sync script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/sync-edpa.sh --tag "${{ steps.resolve.outputs.tag }}"

      - name: Validate
        run: make validate

      - name: Create PR with changes
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "feat(edpa): sync tm-edpa to ${{ steps.resolve.outputs.tag }}"
          branch: "sync/edpa-${{ steps.resolve.outputs.tag }}"
          delete-branch: true
          title: "feat(edpa): sync tm-edpa to ${{ steps.resolve.outputs.tag }}"
          body: |
            Automated sync of `packs/tm-edpa/` from
            [technomaton/edpa@${{ steps.resolve.outputs.tag }}](https://github.com/technomaton/edpa/releases/tag/${{ steps.resolve.outputs.tag }}).

            - Source: `gh release download` from GitHub
            - Lock file: `imports.lock` updated automatically
            - Validation: `make validate` passed in CI

            Review the diff, ensure the upstream changelog is reflected
            in `packs/tm-edpa/CHANGELOG.md`, then merge.
          labels: |
            edpa
            sync
            dependencies
